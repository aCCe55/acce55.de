<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="tatze_icon.svg">
  <title>aCCe55 | 404</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap");
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
      gap: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 1; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at center, transparent 40%, #0d0d10 100%);
    }
    .page {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; gap: 32px;
      width: 100%;
      padding: 24px 16px;
    }
    #c {
      width: min(480px, calc(100vw - 32px));
      height: auto; /* preserve the 480:340 aspect ratio as it scales down */
      display: block;
    }
    .err-num {
      font-size: clamp(56px, 13vw, 110px);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #f1f5f9;
      line-height: 1;
      opacity: 0;
      transition: opacity 1s ease;
      text-align: center;
    }
    .err-msg {
      font-size: clamp(12px, 3.2vw, 16px);
      font-weight: 300;
      color: rgba(168,192,255,0.45);
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
      text-align: center;
      padding: 0 8px;
    }
    .buttons {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      opacity: 0;
      transition: opacity 1s ease 0.6s;
    }
    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
      padding: 9px 20px;
      display: inline-flex; align-items: center; gap: 8px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      position: relative;
      white-space: nowrap;
    }
    @media (max-width: 380px) {
      .page { gap: 20px; }
      .btn { padding: 8px 14px; font-size: 10px; }
    }
    .btn-primary {
      color: rgba(168,192,255,0.55);
      border: 1px solid rgba(168,192,255,0.25);
    }
    .btn-primary::before { content:''; position:absolute; top:-1px; left:-1px; width:5px; height:5px; border-top:1px solid #a8c0ff; border-left:1px solid #a8c0ff; }
    .btn-primary::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:5px; height:5px; border-bottom:1px solid #a8c0ff; border-right:1px solid #a8c0ff; }
    .btn-primary:hover { color:#a8c0ff; border-color:rgba(168,192,255,0.5); background:rgba(168,192,255,0.05); }
    .btn-secondary {
      color: rgba(168,192,255,0.3);
      border: 1px solid rgba(168,192,255,0.1);
    }
    .btn-secondary:hover { color:rgba(168,192,255,0.6); border-color:rgba(168,192,255,0.25); }
    .btn svg { width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  </style>
</head>
<body>
<div class="page">

  <!-- Globe canvas – satellite and orbit drawn here too -->
  <canvas id="c" width="480" height="340"></canvas>

  <!-- 404 -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div class="err-num" id="en">404</div>
    <div class="err-msg" id="em">This page does not seem to exist</div>
  </div>

  <!-- Buttons -->
  <div class="buttons" id="btns">
    <a href="/" class="btn btn-primary">
      <svg viewBox="0 0 12 12"><polyline points="8,2 3,6 8,10"/></svg>
      Ground Control
    </a>
    <a href="javascript:history.back()" class="btn btn-secondary">
      <svg viewBox="0 0 12 12"><polyline points="5,2 2,6 5,10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>
      Go Back
    </a>
  </div>

</div>

<script>
// Fade in UI
window.addEventListener('load', () => {
  setTimeout(() => { document.getElementById('en').style.opacity='1'; }, 300);
  setTimeout(() => { document.getElementById('em').style.opacity='1'; }, 500);
  setTimeout(() => { document.getElementById('btns').style.opacity='1'; }, 700);
});

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const DPR = window.devicePixelRatio || 1;
cvs.width  = W * DPR;
cvs.height = H * DPR;
ctx.scale(DPR, DPR);
const cx = W/2, cy = H/2;
const GLOB_R = 128;

// Globe rotation params
const TILT  = 23.5 * Math.PI/180;
const PITCH = 20   * Math.PI/180;
const ROLL  = -20  * Math.PI/180;

const CONTINENTS = [
  [[70,-140],[72,-130],[70,-95],[72,-80],[68,-75],[63,-64],[50,-55],[47,-53],[44,-66],[42,-70],[35,-75],[30,-80],[25,-80],[20,-87],[15,-83],[8,-77],[15,-85],[20,-105],[22,-106],[25,-110],[30,-117],[34,-120],[40,-124],[48,-124],[55,-130],[60,-140],[70,-140]],
  [[60,-44],[65,-52],[70,-52],[76,-65],[83,-30],[80,-18],[75,-18],[70,-25],[65,-37],[60,-44]],
  [[10,-75],[8,-77],[5,-77],[0,-78],[-5,-80],[-4,-80],[-3,-78],[0,-75],[0,-70],[-5,-65],[-10,-68],[-15,-75],[-18,-70],[-22,-65],[-25,-65],[-28,-62],[-33,-60],[-38,-58],[-42,-63],[-45,-65],[-50,-68],[-53,-70],[-55,-67],[-52,-57],[-45,-56],[-40,-52],[-28,-48],[-22,-42],[-15,-38],[-10,-37],[-5,-35],[0,-48],[5,-52],[8,-60],[10,-62],[11,-70],[10,-75]],
  [[36,-5],[36,5],[40,3],[43,-9],[44,-8],[43,-5],[44,0],[46,2],[48,-2],[48,3],[51,2],[51,4],[54,8],[55,8],[57,10],[58,5],[60,5],[62,6],[63,10],[65,14],[68,14],[70,22],[72,26],[70,30],[65,26],[60,28],[58,26],[55,24],[54,18],[54,14],[54,10],[57,10],[55,8],[54,8],[51,12],[50,14],[49,18],[46,20],[44,28],[41,28],[38,26],[37,22],[37,15],[38,13],[38,8],[36,0],[36,-5]],
  [[56,10],[58,8],[60,5],[62,6],[64,14],[68,18],[70,22],[72,26],[70,28],[68,26],[65,22],[63,18],[62,22],[60,25],[58,22],[56,16],[56,10]],
  [[37,-5],[37,10],[32,12],[30,32],[22,37],[12,43],[5,42],[0,42],[-5,40],[-10,38],[-15,36],[-18,36],[-22,35],[-28,32],[-34,26],[-35,20],[-30,17],[-25,15],[-18,12],[-15,12],[-10,13],[-5,10],[0,8],[5,3],[5,-3],[3,-8],[5,-15],[10,-17],[15,-17],[18,-16],[20,-17],[22,-17],[25,-15],[30,-10],[32,-5],[37,-5]],
  [[70,30],[72,40],[70,60],[68,58],[65,58],[62,62],[60,55],[55,58],[52,58],[50,58],[45,58],[42,52],[40,52],[38,48],[35,48],[30,48],[25,57],[20,58],[12,44],[10,44],[10,78],[8,77],[5,100],[2,104],[0,104],[-5,105],[2,108],[10,104],[15,108],[18,106],[20,110],[20,117],[22,114],[24,118],[28,121],[30,122],[34,120],[38,118],[40,120],[42,130],[45,135],[48,136],[50,140],[55,135],[56,138],[55,133],[52,140],[50,140],[48,142],[46,138],[44,136],[45,133],[48,138],[50,142],[55,140],[60,150],[65,145],[68,140],[70,140],[72,130],[72,100],[70,80],[72,70],[70,60],[72,50],[70,30]],
  [[-16,136],[-14,130],[-14,126],[-16,122],[-20,114],[-22,114],[-26,114],[-30,115],[-32,116],[-34,118],[-34,122],[-34,126],[-32,128],[-34,136],[-38,140],[-38,146],[-36,148],[-34,151],[-30,153],[-28,153],[-24,152],[-22,150],[-20,148],[-16,144],[-14,142],[-12,136],[-12,132],[-14,130],[-16,136]],
];

function rotPt(lat, lon, yaw) {
  const phi=lat*Math.PI/180, lam=lon*Math.PI/180+yaw;
  let x=Math.cos(phi)*Math.sin(lam), y=Math.sin(phi), z=Math.cos(phi)*Math.cos(lam);
  const y1=y*Math.cos(TILT)-z*Math.sin(TILT), z1=y*Math.sin(TILT)+z*Math.cos(TILT);
  const y2=y1*Math.cos(PITCH)-z1*Math.sin(PITCH), z2=y1*Math.sin(PITCH)+z1*Math.cos(PITCH);
  const x2=x*Math.cos(ROLL)-y2*Math.sin(ROLL), y3=x*Math.sin(ROLL)+y2*Math.cos(ROLL);
  return {x:cx+GLOB_R*x2, y:cy-GLOB_R*y3, z:z2, visible:z2>-0.02};
}

// Horizon threshold must match the one used for p.visible above
const HORIZON_Z = -0.02;

function horizonCross(a, b) {
  const ax=(a.x-cx)/GLOB_R, ay=(cy-a.y)/GLOB_R, az=a.z;
  const bx=(b.x-cx)/GLOB_R, by=(cy-b.y)/GLOB_R, bz=b.z;
  const t = (HORIZON_Z-az)/(bz-az);
  let x=ax+(bx-ax)*t, y=ay+(by-ay)*t, z=HORIZON_Z;
  const len=Math.hypot(x,y,z)||1;
  x/=len; y/=len; z/=len;
  return { x: cx+GLOB_R*x, y: cy-GLOB_R*y };
}

function tracePath(ctx, pts) {
  let drawing = false, prev = null;
  for (const p of pts) {
    if (p.visible) {
      if (!drawing) {
        const start = (prev && !prev.visible) ? horizonCross(prev, p) : p;
        ctx.moveTo(start.x, start.y);
        drawing = true;
      } else {
        ctx.lineTo(p.x, p.y);
      }
    } else if (drawing) {
      const c = horizonCross(prev, p);
      ctx.lineTo(c.x, c.y);
      drawing = false;
    }
    prev = p;
  }
}

// Orbit: tilted ellipse, A=semi-major, B=semi-minor, angle T
// z-depth drives opacity gradient for depth illusion
const OA=205, OB=50, OT=-8*Math.PI/180;  // wide horizontal orbit
function orbitPt(t) {
  const ex=OA*Math.cos(t), ey=OB*Math.sin(t);
  const x=cx + ex*Math.cos(OT) - ey*Math.sin(OT);
  const y=cy + ex*Math.sin(OT) + ey*Math.cos(OT);
  // depth: sin(t) – back = negative, front = positive
  const z = Math.sin(t);  // flipped: upper arc is front (bright), lower is back (dim)
  return {x, y, z};
}

// 3D wireframe satellite geometry
function makeSatVerts() {
  // Body 12×7×7, panels 16×5, antenna up
  const bx=6,by=3.5,bz=3.5;
  const verts=[
    [-bx,-by,-bz],[-bx,-by,bz],[-bx,by,-bz],[-bx,by,bz],
    [ bx,-by,-bz],[ bx,-by,bz],[ bx,by,-bz],[ bx,by,bz],
    // Left panel corners
    [-bx-14,-5,-1],[-bx-14,5,-1],[-bx,-5,-1],[-bx,5,-1],
    // Right panel corners
    [ bx,-5,-1],[ bx,5,-1],[ bx+14,-5,-1],[ bx+14,5,-1],
    // Antenna
    [0,-by,0],[0,-by-9,0],
    // Panel mid points
    [-bx-7,-5,-1],[-bx-7,5,-1], // left mid
    [ bx+7,-5,-1],[ bx+7,5,-1], // right mid
  ];
  const edges=[
    // Body
    [0,1,'b'],[2,3,'b'],[4,5,'b'],[6,7,'b'],
    [0,2,'b'],[1,3,'b'],[4,6,'b'],[5,7,'b'],
    [0,4,'b'],[1,5,'b'],[2,6,'b'],[3,7,'b'],
    // Left panel outline
    [8,9,'p'],[9,11,'p'],[10,11,'p'],[8,10,'p'],
    // Left panel grid
    [18,19,'g'],
    // Right panel outline
    [12,13,'p'],[13,15,'p'],[14,15,'p'],[12,14,'p'],
    // Right panel grid
    [20,21,'g'],
    // Antenna
    [16,17,'a'],
  ];
  return {verts, edges};
}
const SAT = makeSatVerts();

const ORBIT_PHI = Math.acos(OB / OA);
const ORBIT_U = [Math.cos(OT), Math.sin(OT), 0];
const ORBIT_V = [-Math.cos(ORBIT_PHI)*Math.sin(OT), Math.cos(ORBIT_PHI)*Math.cos(OT), Math.sin(ORBIT_PHI)];
function cross(a, b) {
  return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
}

function satFrame(satT, roll) {
  const cosT = Math.cos(satT), sinT = Math.sin(satT);
  const Yaxis = [cosT*ORBIT_U[0] + sinT*ORBIT_V[0],
                 cosT*ORBIT_U[1] + sinT*ORBIT_V[1],
                 cosT*ORBIT_U[2] + sinT*ORBIT_V[2]]; // radially outward (zenith)
  const Xtravel = [-sinT*ORBIT_U[0] + cosT*ORBIT_V[0],
                 -sinT*ORBIT_U[1] + cosT*ORBIT_V[1],
                 -sinT*ORBIT_U[2] + cosT*ORBIT_V[2]]; // tangential (velocity)
  const Ztravel = cross(Xtravel, Yaxis);

  // Roll X/Z around Y by the independent spin angle – antenna (Y) untouched
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const Xaxis = [Xtravel[0]*cr + Ztravel[0]*sr, Xtravel[1]*cr + Ztravel[1]*sr, Xtravel[2]*cr + Ztravel[2]*sr];
  const Zaxis = [Ztravel[0]*cr - Xtravel[0]*sr, Ztravel[1]*cr - Xtravel[1]*sr, Ztravel[2]*cr - Xtravel[2]*sr];

  return { Xaxis, Yaxis, Zaxis };
}

function projectSat(v, frame, sx, sy) {
  const [vx, vy, vz] = v;
  const { Xaxis, Yaxis, Zaxis } = frame;
  const wx = vx*Xaxis[0] + vy*Yaxis[0] + vz*Zaxis[0];
  const wy = vx*Xaxis[1] + vy*Yaxis[1] + vz*Zaxis[1];
  const wz = vx*Xaxis[2] + vy*Yaxis[2] + vz*Zaxis[2];
  return { x: sx + wx, y: sy + wy, z: wz };
}

function drawSat(pos, satT, depth, spinT) {
  const {x:sx,y:sy} = pos;
  const sc    = 1.0;
  const alpha = 0.25 + 0.75*((depth+1)/2);
  const frame = satFrame(satT, spinT);
  const proj = SAT.verts.map(v => projectSat(v, frame, sx, sy));

  const styles={
    b:{color:`rgba(168,192,255,${0.85*alpha})`,lw:0.85},
    p:{color:`rgba(168,192,255,${0.7*alpha})`, lw:0.75},
    g:{color:`rgba(168,192,255,${0.25*alpha})`,lw:0.45},
    a:{color:`rgba(168,192,255,${0.9*alpha})`, lw:0.7},
  };

  SAT.edges.forEach(([a,b,t])=>{
    const pa=proj[a],pb=proj[b];
    const s=styles[t];
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle=s.color; ctx.lineWidth=s.lw; ctx.stroke();
  });

  // Antenna tip glow
  const tip = proj[17];
  const g2=ctx.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,3.5*sc);
  g2.addColorStop(0,`rgba(168,192,255,${alpha})`);
  g2.addColorStop(1,'rgba(168,192,255,0)');
  ctx.beginPath(); ctx.arc(tip.x,tip.y,3.5*sc,0,Math.PI*2);
  ctx.fillStyle=g2; ctx.fill();
  ctx.beginPath(); ctx.arc(tip.x,tip.y,1*sc,0,Math.PI*2);
  ctx.fillStyle=`rgba(220,235,255,${alpha})`; ctx.fill();

  // Label: fixed size, only opacity varies with depth
  {
    const la  = 0.15 + 0.75*((depth+1)/2);
    const fs  = 7;   // fixed font size – no jumping
    const lx  = sx;
    const ly  = sy - 22; // fixed offset above satellite
    ctx.font  = `bold ${fs}px 'JetBrains Mono',monospace`;
    ctx.textAlign = 'center';
    const txt = 'No Signal :(';
    const tw  = ctx.measureText(txt).width + 10;
    const th  = fs + 6;
    ctx.fillStyle = `rgba(8,8,18,0.92)`;
    ctx.fillRect(lx-tw/2, ly, tw, th);
    ctx.strokeStyle = `rgba(168,192,255,${la*0.4})`;
    ctx.lineWidth   = 0.6;
    ctx.strokeRect(lx-tw/2, ly, tw, th);
    ctx.fillStyle   = `rgba(200,220,255,${la})`;
    ctx.fillText(txt, lx, ly+th-4);
  }
}

function drawOrbit(satT) {
  // Draw orbit as individual dash segments with depth-based opacity
  const STEPS = 180;
  const dashLen = 5, gapLen = 5;
  const segLen = dashLen + gapLen;

  for (let i=0; i<STEPS; i++) {
    const t0=(i/STEPS)*Math.PI*2;
    const t1=((i+0.5)/STEPS)*Math.PI*2; // half step = dash
    const p0=orbitPt(t0), p1=orbitPt(t1);

    // Depth: z ranges -1 (back) to +1 (front)
    const depth=(p0.z+1)/2; // 0..1
    // Opacity: dim at back (0.08), bright at front (0.38)
    const alpha=0.08+0.30*depth;

    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y);
    ctx.strokeStyle=`rgba(168,192,255,${alpha})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }
}

let globeAngle=0, satT=0, spinT=0;

function draw() {
  ctx.clearRect(0,0,W,H);
  const sat=orbitPt(satT);

  // 1. Back orbit
  drawOrbit(satT);

  // 2. Globe
  ctx.strokeStyle='rgba(168,192,255,0.13)'; ctx.lineWidth=0.55;
  for(let lat=-80;lat<=80;lat+=20){
    const pts=[]; for(let lon=-180;lon<=180;lon+=2) pts.push(rotPt(lat,lon,globeAngle));
    ctx.beginPath(); tracePath(ctx,pts); ctx.stroke();
  }
  for(let lon=0;lon<360;lon+=20){
    const pts=[]; for(let lat=-80;lat<=80;lat+=2) pts.push(rotPt(lat,lon,globeAngle));
    ctx.beginPath(); tracePath(ctx,pts); ctx.stroke();
  }
  ctx.strokeStyle='rgba(180,210,255,0.5)'; ctx.lineWidth=0.85;
  for(const cont of CONTINENTS){
    const pts = cont.map(([la,lo])=>rotPt(la,lo,globeAngle));
    ctx.beginPath(); tracePath(ctx,pts); ctx.stroke();
  }

  // 3. Satellite on top
  drawSat(sat, satT, sat.z, spinT);

  globeAngle+=0.003;
  satT=(satT+0.007)%(Math.PI*2);
  spinT=(spinT+0.005)%(Math.PI*2);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
